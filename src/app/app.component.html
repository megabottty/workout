<div class="app-shell">
  <header>
    <h1>Workout Progress Tracker</h1>
    <ng-container *ngIf="user() as user; else signedOutNav">
      <nav>
        <a routerLink="/workouts/log" routerLinkActive="active">Log Workout</a>
        <a routerLink="/history" routerLinkActive="active">Weekly History</a>
        <button type="button" (click)="signOut()">Sign out</button>
      </nav>
      <p class="signed-in-as">Signed in as {{ user.email }}</p>
    </ng-container>
    <ng-template #signedOutNav>
      <nav>
        <a routerLink="/login" routerLinkActive="active">Sign in</a>
      </nav>
    </ng-template>
  </header>

  <main>
    <router-outlet />
  </main>
</div>

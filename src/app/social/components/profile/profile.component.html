<section class="profile-page">
  <div class="profile-card">
    <h2>My Profile</h2>

    @if (profile(); as p) {
      <div class="avatar-preview">
        <span class="avatar">{{ p.avatarInitials }}</span>
        <div class="avatar-copy">
          <p class="display-name-preview">{{ p.displayName }}</p>
        </div>
      </div>
    }

    <div class="form-group">
      <label for="displayName">Display Name</label>
      <input
        id="displayName"
        type="text"
        [ngModel]="displayNameInput()"
        (ngModelChange)="displayNameInput.set($event)"
        placeholder="e.g. Megan 💪"
        maxlength="40"
      />
    </div>

    <div class="feedback-messages">
      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="success-msg">{{ successMessage() }}</p>
      }
    </div>

    <div class="form-actions">
      <button type="button" class="btn-primary" (click)="saveProfile()" [disabled]="isSaving()">
        {{ isSaving() ? 'Saving…' : 'Save Profile' }}
      </button>
    </div>
  </div>
</section>
